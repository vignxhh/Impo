<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Word Imposter – Host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap wide">

    <section id="loading" class="panel">
      <p class="muted" style="margin:0">Loading…</p>
    </section>

    <!-- Login -->
    <section id="loginView" class="hidden" style="max-width:420px">
      <h1>Host login</h1>
      <div class="panel">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
        <p id="loginError" class="error" role="alert"></p>
        <button id="loginBtn" class="block">Sign in</button>
      </div>
    </section>

    <!-- Host panel -->
    <section id="hostView" class="hidden">
      <div class="row between" style="margin-bottom:18px">
        <h1 style="margin:0">Host</h1>
        <div class="row">
          <span id="roundInfo" class="tag">No round yet</span>
          <button id="logoutBtn" class="ghost small">Sign out</button>
        </div>
      </div>

      <div class="grid-2">
        <div class="panel">
          <h2>Words</h2>
          <label for="wordMain">Word for everyone</label>
          <input id="wordMain" type="text" maxlength="30" autocomplete="off" placeholder="e.g. bike">
          <label for="wordOdd">Word for one random player</label>
          <input id="wordOdd" type="text" maxlength="30" autocomplete="off" placeholder="e.g. car">
          <p id="hostError" class="error" role="alert"></p>
          <div class="row">
            <button id="startBtn">Start round</button>
            <button id="resetBtn" class="ghost">End round</button>
          </div>
        </div>

        <div class="panel">
          <div class="row between" style="margin-bottom:8px">
            <h2 style="margin:0">Players</h2>
            <span id="playerCount" class="count">0</span>
          </div>
          <ul id="playerList" class="players"></ul>
          <p id="emptyMsg" class="muted" style="margin:0">Nobody has joined yet. Share the player link.</p>
          <div style="margin-top:14px">
            <button id="clearBtn" class="ghost small">Remove all players</button>
          </div>
        </div>
      </div>
    </section>

  </main>
  <script type="module" src="host.js"></script>
</body>
</html>
